
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaeaf0">

  <title>利用規約 | Mac風ウィンドウ表示テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      background: linear-gradient(
        135deg,
        #f4f1f8,
        #e7e9f0
      );
      color: #26242b;
    }

    .desktop {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 4vw, 55px);
    }

    .window {
      width: min(1150px, 100%);
      height: calc(100dvh - clamp(24px, 8vw, 110px));
      max-height: 840px;
      min-height: 320px;

      display: flex;
      flex-direction: column;

      background: #ffffff;
      border: 1px solid #d6d4dd;
      border-radius: 15px;
      overflow: hidden;

      box-shadow:
        0 25px 65px #2620382a,
        0 4px 12px #26203812;

      transition: width .25s, height .25s;
    }

    .toolbar {
      height: 46px;
      flex: none;

      display: grid;
      grid-template-columns: 82px 1fr 82px;
      align-items: center;

      padding: 0 15px;

      background: linear-gradient(
        #fafafa,
        #f0eff3
      );

      border-bottom: 1px solid #dddce4;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .controls button {
      width: 13px;
      height: 13px;
      padding: 0;
      border-radius: 50%;
      border: 1px solid #0002;
      cursor: pointer;
    }

    .red {
      background: #ff5f57;
    }

    .yellow {
      background: #febc2e;
    }

    .green {
      background: #28c840;
    }

    .window-title {
      font-size: 12px;
      font-weight: 600;
      color: #6c6872;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .frame {
      flex: 1;
      min-height: 0;
    }

    .frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .window.minimized {
      height: 46px;
      min-height: 46px;
    }

    .window.minimized .frame {
      display: none;
    }

    .window.maximized {
      width: 100%;
      height: calc(100dvh - 24px);
      max-height: none;
    }

    .window.closed {
      display: none;
    }

    .launch {
      display: none;
      background: white;
      border: 1px solid #ddd5e6;
      border-radius: 16px;
      padding: 20px 26px;
      box-shadow: 0 12px 30px #0002;
      font: inherit;
      cursor: pointer;
      color: #56366d;
    }

    .launch.visible {
      display: block;
    }

    @media (max-width: 600px) {
      .desktop {
        padding: 12px;
      }

      .window {
        height: calc(100dvh - 24px);
        max-height: none;
        border-radius: 12px;
      }

      .toolbar {
        height: 44px;
        padding: 0 12px;
        grid-template-columns: 68px 1fr 68px;
      }

      .controls {
        gap: 7px;
      }

      .controls button {
        width: 12px;
        height: 12px;
      }

      .window-title {
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .window {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main class="desktop">

    <section
      class="window"
      id="window"
      aria-label="利用規約ウィンドウ"
    >

      <header class="toolbar">

        <div class="controls">
          <button
            class="red"
            id="close"
            aria-label="閉じる"
            title="閉じる"
          ></button>

          <button
            class="yellow"
            id="minimize"
            aria-label="最小化"
            title="最小化"
          ></button>

          <button
            class="green"
            id="maximize"
            aria-label="最大化"
            title="最大化"
          ></button>
        </div>

        <div class="window-title">
          利用規約 — 日次レポートビューアー・配信システム
        </div>

        <div></div>

      </header>

      <div class="frame">
        <iframe
          src="https://yagisan-createstudio.github.io/terms_of_service/"
          title="利用規約本文"
          loading="eager"
        ></iframe>
      </div>

    </section>

    <button class="launch" id="launch">
      利用規約を開く
    </button>

  </main>

  <script>
    const win = document.getElementById("window");
    const launch = document.getElementById("launch");

    document.getElementById("close")
      .addEventListener("click", () => {
        win.classList.add("closed");
        launch.classList.add("visible");
      });

    launch.addEventListener("click", () => {
      win.classList.remove("closed", "minimized");
      launch.classList.remove("visible");
    });

    document.getElementById("minimize")
      .addEventListener("click", () => {
        win.classList.toggle("minimized");
      });

    document.getElementById("maximize")
      .addEventListener("click", () => {
        win.classList.remove("minimized");
        win.classList.toggle("maximized");
      });
  </script>

</body>
</html>
