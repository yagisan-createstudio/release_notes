<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eaf2">
<title>Desktop | Documents</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:#252630}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#e9eaf2}button{font:inherit}button:focus-visible{outline:2px solid #7754b5;outline-offset:3px}
.desktop{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 20% 15%,#f7f1fa 0%,transparent 55%),linear-gradient(145deg,#e9eaf2,#cdd6e7 70%,#e5d9ed)}
.menubar{position:absolute;top:0;left:0;right:0;height:31px;background:#ffffff65;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff70;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px;color:#383640;z-index:20;user-select:none}.menubar strong{font-weight:750}.menubar .right{opacity:.7}
.window{position:absolute;top:5%;left:4%;width:92vw;height:87dvh;min-width:280px;min-height:180px;display:flex;flex-direction:column;background:#fff;border:1px solid #c8c8d2;border-radius:12px;overflow:hidden;box-shadow:0 25px 65px #30304038,0 5px 16px #30304018}.window[hidden]{display:none!important}.window[data-kind="release"]{top:7%;left:5%;width:89vw;height:84dvh}.window[data-kind="notice"]{top:9%;left:6%;width:87vw;height:82dvh}
.toolbar{height:43px;flex:none;display:grid;grid-template-columns:80px 1fr 80px;align-items:center;background:linear-gradient(#fafafd,#eeedf2);border-bottom:1px solid #dcdce2;padding:0 13px;cursor:grab;user-select:none;touch-action:none}.toolbar:active{cursor:grabbing}.traffic{display:flex;gap:8px;align-items:center}.traffic button{height:13px;width:13px;border-radius:50%;border:1px solid #0002;padding:0;cursor:pointer}.close{background:#ff5f57}.minimize{background:#febc2e}.maximize{background:#28c840}.window-title{text-align:center;font-size:12px;color:#575562;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.body{flex:1;min-height:0;background:#fff}.body iframe{height:100%;width:100%;border:0;display:block}.window.minimized .body{display:none}.window.minimized{height:43px!important;min-height:43px}.window.maximized{inset:37px 12px 12px 12px!important;width:auto!important;height:auto!important}
.placeholder{height:100%;overflow:auto;padding:clamp(24px,5vw,60px);line-height:1.8}.placeholder h1{font-size:clamp(22px,3vw,30px);margin:0 0 14px}.placeholder p{font-size:14px;color:#68717b}.placeholder .note{padding:20px 22px;border:1px solid #e6e5ee;border-radius:12px;background:#f8f7fb;margin-top:28px}
.desktop-icon{position:absolute;right:clamp(18px,3vw,48px);bottom:calc(22px + env(safe-area-inset-bottom));width:100px;border:0;background:none;color:#242b3a;display:flex;align-items:center;flex-direction:column;gap:6px;cursor:pointer;padding:8px;border-radius:12px;z-index:30;text-shadow:0 1px 2px #fff8}.desktop-icon:hover,.desktop-icon[aria-expanded="true"]{background:#ffffff60}.desktop-icon svg{width:75px;height:64px;filter:drop-shadow(0 5px 4px #29354b30)}.desktop-icon span{font-size:13px;font-weight:600;letter-spacing:.02em}
.menu{position:absolute;right:clamp(18px,3vw,48px);bottom:calc(122px + env(safe-area-inset-bottom));width:230px;padding:7px;border:1px solid #ffffffb5;background:#f9f9fce8;backdrop-filter:blur(22px);border-radius:12px;box-shadow:0 15px 40px #29304736;z-index:35}.menu[hidden]{display:none}.menu button{width:100%;border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:7px;color:#282a34;cursor:pointer;font-size:14px}.menu button:hover,.menu button:focus-visible{background:#e7e1f4}
@media(max-width:650px){.menubar{height:29px;padding:0 12px}.window,.window[data-kind="release"],.window[data-kind="notice"]{top:5%;left:3%;width:94%;height:83dvh;min-width:0;min-height:0}.window[data-kind="release"]{top:6%;left:4%}.window[data-kind="notice"]{top:7%;left:5%}.toolbar{height:42px;grid-template-columns:73px 1fr 73px}.desktop-icon{right:12px;bottom:calc(17px + env(safe-area-inset-bottom));width:94px}.desktop-icon svg{width:70px}.menu{right:12px;bottom:calc(113px + env(safe-area-inset-bottom))}.window.maximized{inset:34px 7px 75px 7px!important}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body><main class="desktop" id="desktop">
<div class="menubar"><strong>Documents</strong><span class="right">Desktop</span></div>
<section class="window" id="terms" data-kind="terms" aria-label="利用規約ウィンドウ"><div class="toolbar"><div class="traffic"><button class="close" aria-label="利用規約を閉じる"></button><button class="minimize" aria-label="利用規約を最小化"></button><button class="maximize" aria-label="利用規約を最大化"></button></div><span class="window-title">利用規約</span><span></span></div><div class="body"><iframe src="https://yagisan-createstudio.github.io/terms_of_service/" title="利用規約本文"></iframe></div></section>
<section class="window" id="release" data-kind="release" aria-label="リリースノートウィンドウ" hidden><div class="toolbar"><div class="traffic"><button class="close" aria-label="リリースノートを閉じる"></button><button class="minimize" aria-label="リリースノートを最小化"></button><button class="maximize" aria-label="リリースノートを最大化"></button></div><span class="window-title">リリースノート</span><span></span></div><div class="body"><div class="placeholder"><h1>リリースノート</h1><p>システムの更新履歴を掲載するページです。</p><div class="note">現在、掲載内容を準備しています。</div></div></div></section>
<section class="window" id="notice" data-kind="notice" aria-label="お知らせウィンドウ" hidden><div class="toolbar"><div class="traffic"><button class="close" aria-label="お知らせを閉じる"></button><button class="minimize" aria-label="お知らせを最小化"></button><button class="maximize" aria-label="お知らせを最大化"></button></div><span class="window-title">お知らせ</span><span></span></div><div class="body"><div class="placeholder"><h1>お知らせ</h1><p>システムに関するご案内を掲載するページです。</p><div class="note">現在、お知らせはありません。</div></div></div></section>
<button class="desktop-icon" id="folder" aria-label="Menuを開く" aria-expanded="false" aria-controls="file-menu">
<svg viewBox="0 0 110 92" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="folderback" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2aaae7"/><stop offset="1" stop-color="#0878be"/></linearGradient><linearGradient id="folderfront" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7bd5fa"/><stop offset=".35" stop-color="#5ac5f5"/><stop offset="1" stop-color="#25a8e6"/></linearGradient></defs><path d="M6 22 Q6 12 17 12 H43 Q47 12 51 17 L58 22 H94 Q104 22 104 33 V76 Q104 85 94 85 H16 Q6 85 6 75 Z" fill="url(#folderback)" stroke="#1775a7" stroke-width="1.5"/><path d="M7 34 Q7 29 14 29 H96 Q103 29 103 37 V75 Q103 84 94 84 H16 Q7 84 7 75 Z" fill="url(#folderfront)" stroke="#46b6e8" stroke-width="1"/><path d="M12 38 H98" stroke="#a9ebff" stroke-width="2" opacity=".75"/><path d="M12 73 H98" stroke="#a8ebff" stroke-width="2" opacity=".22"/></svg>
<span>Menu</span></button>
<div class="menu" id="file-menu" hidden role="menu" aria-label="開くドキュメント"><button type="button" role="menuitem" data-open="terms">利用規約</button><button type="button" role="menuitem" data-open="release">リリースノート</button><button type="button" role="menuitem" data-open="notice">お知らせ</button></div>
</main><script>
const folder=document.getElementById('folder'),menu=document.getElementById('file-menu');let topZ=3;
function setMenu(open){menu.hidden=!open;folder.setAttribute('aria-expanded',String(open))}
folder.addEventListener('click',()=>setMenu(menu.hidden));
document.querySelectorAll('[data-open]').forEach(button=>button.addEventListener('click',()=>{const win=document.getElementById(button.dataset.open);win.hidden=false;win.classList.remove('minimized');win.style.zIndex=++topZ;setMenu(false)}));
document.querySelectorAll('.window').forEach(win=>{const bar=win.querySelector('.toolbar');win.addEventListener('pointerdown',()=>win.style.zIndex=++topZ);win.querySelector('.close').addEventListener('click',()=>win.hidden=true);win.querySelector('.minimize').addEventListener('click',()=>win.classList.toggle('minimized'));win.querySelector('.maximize').addEventListener('click',()=>{win.classList.remove('minimized');win.classList.toggle('maximized')});let drag=null;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||win.classList.contains('maximized')||matchMedia('(max-width:650px)').matches)return;drag={x:e.clientX,y:e.clientY,left:win.offsetLeft,top:win.offsetTop};bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!drag)return;win.style.left=Math.max(0,Math.min(innerWidth-90,drag.left+e.clientX-drag.x))+'px';win.style.top=Math.max(30,Math.min(innerHeight-45,drag.top+e.clientY-drag.y))+'px'});bar.addEventListener('pointerup',()=>drag=null);bar.addEventListener('pointercancel',()=>drag=null)});
document.addEventListener('pointerdown',e=>{if(!menu.contains(e.target)&&!folder.contains(e.target))setMenu(false)});document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
</script></body></html>
