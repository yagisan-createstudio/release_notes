<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ecebf1">
<title>利用規約 | Mac風テスト</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}
body{background:linear-gradient(135deg,#f4f1f7,#e6e8f0);color:#292630}
.desktop{min-height:100vh;min-height:100dvh;padding:clamp(12px,4vw,52px);display:flex;align-items:center;justify-content:center}
.window{width:min(1160px,100%);height:min(820px,calc(100dvh - 2 * clamp(12px,4vw,52px)));min-height:320px;display:flex;flex-direction:column;background:#fff;border:1px solid #d2d2db;border-radius:14px;overflow:hidden;box-shadow:0 25px 70px #25203527,0 4px 15px #25203512;transition:width .25s,height .25s}
.toolbar{height:46px;flex:none;display:grid;grid-template-columns:82px minmax(0,1fr) 82px;align-items:center;padding:0 15px;background:linear-gradient(#fafafa,#f0eff3);border-bottom:1px solid #dedde5}
.controls{display:flex;align-items:center;gap:8px}
.controls button{width:13px;height:13px;padding:0;border:1px solid #0002;border-radius:50%;cursor:pointer}
.controls button:focus-visible,.launch:focus-visible{outline:2px solid #73429b;outline-offset:3px}
.red{background:#ff5f57}.yellow{background:#febc2e}.green{background:#28c840}
.title{font-size:12px;font-weight:600;color:#67636e;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame{flex:1;min-height:0}.frame iframe{display:block;width:100%;height:100%;border:0;background:white}
.window.minimized{height:46px;min-height:46px}.window.minimized .frame{display:none}
.window.maximized{width:100%;height:calc(100dvh - 24px);max-height:none}.window.closed{display:none}
.launch{display:none;padding:17px 25px;background:white;color:#613a80;border:1px solid #e1dbe8;border-radius:15px;box-shadow:0 10px 30px #0002;font:inherit;cursor:pointer}.launch.visible{display:block}
@media(max-width:600px){.desktop{padding:12px}.window{height:calc(100dvh - 24px);max-height:none;border-radius:12px}.toolbar{height:44px;padding:0 12px;grid-template-columns:68px minmax(0,1fr) 68px}.controls{gap:7px}.controls button{width:12px;height:12px}.title{font-size:11px}}
@media(prefers-reduced-motion:reduce){.window{transition:none}}
</style>
</head>
<body>
<main class="desktop">
<section class="window" id="window" aria-label="利用規約ウィンドウ">
<header class="toolbar">
<div class="controls">
<button class="red" id="close" aria-label="閉じる" title="閉じる"></button>
<button class="yellow" id="minimize" aria-label="最小化" title="最小化"></button>
<button class="green" id="maximize" aria-label="最大化切り替え" title="最大化切り替え"></button>
</div>
<div class="title">利用規約</div><div></div>
</header>
<div class="frame"><iframe src="https://yagisan-createstudio.github.io/terms_of_service/" title="利用規約本文" loading="eager"></iframe></div>
</section>
<button class="launch" id="launch">利用規約を開く</button>
</main>
<script>
const win=document.getElementById('window'),launch=document.getElementById('launch');
document.getElementById('close').addEventListener('click',()=>{win.classList.add('closed');launch.classList.add('visible')});
launch.addEventListener('click',()=>{win.classList.remove('closed','minimized');launch.classList.remove('visible')});
document.getElementById('minimize').addEventListener('click',()=>win.classList.toggle('minimized'));
document.getElementById('maximize').addEventListener('click',()=>{win.classList.remove('minimized');win.classList.toggle('maximized')});
</script>
</body>
</html>
